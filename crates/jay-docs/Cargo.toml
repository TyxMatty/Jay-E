[package]
name = "jay-docs"
version = "0.1.0"
description = "Jay-E's engine: file detection, documents, images and video, without Tauri"
authors = ["TyxMatty"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Pages go to the page as PNG made with fdeflate's fastest mode (already in the tree through hayro)
# instead of raw RGBA, which the WebView2 protocol moves at ~14 ms/MB (spike S1).
png = "0.18"
# PDF: pure Rust (spike S1, docs/ARQUITETURA.md). The 14 standard fonts and the CJK CMaps are
# embedded so PDFs that don't embed them still draw.
hayro = { version = "0.9", features = ["embed-fonts", "embed-cmaps"] }
pulldown-cmark = "0.13"
ammonia = "4"
math-core = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi", "rayon"] }
webp = { version = "0.3", default-features = false }
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rayon = "1"
rgb = "0.8"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
mp4-atom = "0.17"

# hayro is far too slow unoptimized; the tests and `npm run dev` build it optimized.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
crc32fast = "1"
serde_json = "1"

# Video conversion through Media Foundation (comes with Windows; decision D3). The same windows
# crate version Tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"] }
