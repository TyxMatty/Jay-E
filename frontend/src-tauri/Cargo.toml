[package]
name = "jay-e"
version = "0.1.0"
description = "Jay-E — documents, images and video: read, edit and convert"
authors = ["TyxMatty"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# features = ["tex"]: the LaTeX engine (Tectonic) inside the app; its C libraries come from vcpkg.
jay-docs = { path = "../../crates/jay-docs", features = ["tex"] }
# The decoded images the editor holds (jay-docs decodes them); the same versions as jay-docs.
image = { version = "0.25", default-features = false }
rayon = "1"
# Updates (src/update.rs): the latest GitHub release, checked by its SHA-256; the same crates as Jay-H.
semver = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[profile.release]
# Smaller, leaner binaries (same as Jay-C).
codegen-units = 1
lto = true
opt-level = "s"
# Not "abort": a malformed PDF that makes hayro panic is caught (jay_docs::pdf::guard) instead of
# closing the app.
panic = "unwind"
strip = true

# hayro draws far too slowly unoptimized: optimize the dependencies in `npm run dev` too.
[profile.dev.package."*"]
opt-level = 3
