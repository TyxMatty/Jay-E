[package]
name = "jay-e"
version = "0.2.2"
description = "Jay-E — documents, images and video: read, edit and convert"
authors = ["TyxMatty"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# features = ["tex"]: the LaTeX engine (Tectonic) inside the app; its C libraries come from vcpkg.
jay-docs = { path = "../../crates/jay-docs", features = ["tex"] }
# The decoded images the editor holds (jay-docs decodes them); the same versions as jay-docs.
image = { version = "0.25", default-features = false }
rayon = "1"
# The shared updater of the Jay line; bump together with the Jay-I `ref` in .github/workflows/installer.yml.
jay-i = { git = "https://github.com/TyxMatty/Jay-I", rev = "f4f9ef07c0cf49abd1f53d3caa00c69e5aa1c90a" }

[profile.release]
# Smaller, leaner binaries (same as Jay-C).
codegen-units = 1
lto = true
opt-level = "s"
# Not "abort": a malformed PDF that makes hayro panic is caught (jay_docs::pdf::guard) instead of
# closing the app.
panic = "unwind"
strip = true

# hayro draws far too slowly unoptimized: optimize the dependencies in `npm run dev` too.
[profile.dev.package."*"]
opt-level = 3

# The taskbar icon in the style's colors (src/taskbar_icon.rs), as in Jay-C; spelling (src/spell.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
